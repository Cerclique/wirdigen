# git-cliff configuration. See docs/releasing.md and spec §11, §12.4.

[changelog]
header = """
# Changelog

All notable changes to Wirdigen are documented here. The changelog is generated by \
[git-cliff](https://git-cliff.org) from conventional commits. \
Commits scoped `diagnostics` appear under **New warnings**: a release that adds a warning can \
break a build that passes `--deny-warnings`, so check that group before upgrading.\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope and commit.group != "<!-- 0 -->New warnings" %}**{{ commit.scope }}:** {% endif -%}
  {% if commit.breaking %}[**breaking**] {% endif -%}
  {{ commit.message | split(pat="\n") | first | upper_first }}
{%- endfor %}
{% endfor %}

"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"

# Order is enforced by the HTML comment prefixes, which the template strips.
# "New warnings" comes first: it is what users scan for before upgrading.
commit_parsers = [
  # Not user-facing.
  { message = "^chore: release", skip = true },
  { message = "^Merge ", skip = true },
  { field = "scope", pattern = "^deps$", skip = true },
  { field = "scope", pattern = "^diagnostics$", group = "<!-- 0 -->New warnings" },
  { group = "<!-- 1 -->Breaking changes", breaking = true },
  { group = "<!-- 2 -->Features", message = "^feat" },
  { group = "<!-- 3 -->Bug fixes", message = "^fix" },
  { group = "<!-- 4 -->Performance", message = "^perf" },
  { group = "<!-- 5 -->Documentation", message = "^docs" },
  { group = "<!-- 6 -->Refactoring", message = "^refactor" },
  # test, build, ci, style and chore stay out of the changelog.
  { message = "^(test|build|ci|style|chore)", skip = true },
]
