  - { name: u16, type: uint16 }
  - { name: u24, type: uint24 }
  - { name: u32, type: uint32 }
  - { name: u40, type: uint40 }
  - { name: u48, type: uint48 }
  - { name: u56, type: uint56 }
  - { name: u64, type: uint64 }
  - { name: i8, type: int8 }
  - { name: i16, type: int16 }
  - { name: i24, type: int24 }
  - { name: i32, type: int32 }
  - { name: i40, type: int40 }
  - { name: i48, type: int48 }
  - { name: i56, type: int56 }
  - { name: i64, type: int64 }
