# Generated by tests/stress.rs: run `make refresh-stress`, never edit by hand.
# Every feature at least once, at an ordinary size.
name: stress_coverage
title: Stress coverage
registration:
  ports:
    udp: [41000, "41010-41020"]
    tcp: [41001]
framing:
  header: 4
  length: "len + 4"
endian: big
info: "{kind} len={len} {{{flags.urgent}}} {flags.prio} {body} {hello}"
fields:
  - name: flags
    type: uint8
    display: hex
    bits:
      - { name: urgent, width: 1, true: Urgent, false: Normal }
      - { name: prio, width: 3, values: { 0: low, "1-6": mid, 7: high } }
      - { padding: 1 }
      - { name: tag, width: 3, display: oct, unit: [tag, tags], expect: [1, "2-3"], hidden: true }
  - { name: kind, type: uint8, values: Kind, expect: "0-9" }
  - { name: len, type: uint16, unit: [byte, bytes] }
  - { name: opt, type: uint8, if: "kind == 1", label: Optional, description: Read for kind 1 }
  - { name: u24, type: uint24, display: dec_hex }
  - { name: u32, type: uint32, display: hex_dec }
  - { name: u40, type: uint40, display: dec }
  - { name: u48, type: uint48, display: oct }
  - { name: u56, type: uint56, endian: little }
  - { name: u64, type: uint64, values: { 0xffffffffffffffff: All ones } }
  - { name: i8, type: int8, values: { "-128--1": Negative, 0: Zero, "1-127": Positive } }
  - { name: i16, type: int16, display: dec, unit: ms }
  - { name: i24, type: int24 }
  - { name: i32, type: int32 }
  - { name: i40, type: int40 }
  - { name: i48, type: int48 }
  - { name: i56, type: int56 }
  - { name: i64, type: int64 }
  - { name: ok, type: bool, true: "yes", false: "no", expect: 1 }
  - { name: ratio, type: float32, unit: "%" }
  - { name: precise, type: float64, unit: [metre, metres] }
  - { name: addr4, type: ipv4 }
  - { name: addr6, type: ipv6 }
  - { name: mac, type: ether }
  - { name: eui, type: eui64 }
  - { name: uuid, type: guid }
  - { name: t_secs, type: abs_time }
  - { name: t_secs_nsecs, type: abs_time, encoding: secs_nsecs, display: local }
  - { name: t_ntp, type: abs_time, encoding: ntp, display: utc }
  - { name: t_msecs, type: abs_time, encoding: msecs, display: doy_utc }
  - { name: t_usecs, type: abs_time, encoding: usecs }
  - { name: t_nsecs, type: abs_time, encoding: nsecs, endian: little }
  - { name: d_secs, type: rel_time, encoding: secs }
  - { name: d_nsecs, type: rel_time, encoding: secs_nsecs }
  - { name: hello, type: string, size: 5, encoding: ascii }
  - { name: user, type: string, prefix: uint8 }
  - { name: note, type: string, prefix: uint16, encoding: utf8, endian: little }
  - { name: path, type: string, terminator: 0, encoding: latin1 }
  - { name: wide, type: string, terminator: 0, encoding: utf16, endian: little }
  - { name: wide_be, type: string, size: 4, encoding: ucs2 }
  - { name: raw, type: bytes, size: "len - _offset - 64", display: plain }
  - { name: dotted, type: bytes, prefix: uint24, display: dot }
  - { name: dashed, type: bytes, prefix: uint32, display: dash }
  - { name: coloned, type: bytes, prefix: uint40, display: colon }
  - { name: spaced, type: bytes, terminator: 0xff, display: space }
  - { name: big_prefix, type: bytes, prefix: uint48 }
  - { name: bigger_prefix, type: bytes, prefix: uint56 }
  - { name: biggest_prefix, type: bytes, prefix: uint64, dissector: data }
  - { padding: 2 }
  - { padding: "kind & 0x3" }
  - name: point
    type: Point
  - name: header
    endian: little
    fields:
      - { name: version, type: uint16 }
      - { name: size, type: uint16 }
  - name: items
    type: Item
    count: "header.size % 4"
  - name: pairs
    count: 2
    fields:
      - { name: a, type: uint8 }
      - { name: b, type: uint8 }
  - name: body
    switch: kind
    cases:
      1: Login
      2:
        - { name: code, type: uint16 }
      "3-5": Point
    default:
      - { name: unknown, type: bytes, size: 1 }
  - name: fixed_choice
    switch: 1
    cases:
      1: [ { name: one, type: uint8 } ]
    default: Login
  - { name: arith, type: uint8, if: "1 + (len * 2 / 3 % 7 - 1) << 1 >> 1 & 0xff ^ 0b1010 | 0x1_0 == 3" }
  - { name: logic, type: uint8, if: "kind != 2 && len < 10 || len <= 1 || len > 2 && len >= 0b0" }
  - { name: unary, type: uint8, if: "!kind || ~kind == -1 || -kind < 0" }
  - { name: flagged, type: uint8, if: "flags.urgent" }
  - { name: everything, type: bytes, size: "_remaining", if: "kind == 9" }
  - name: trailer
    repeat: to_end
    fields:
      - { name: tlv_len, type: uint8 }
      - { name: tlv_value, type: bytes, size: tlv_len }
types:
  Point:
    endian: little
    fields:
      - { name: x, type: int16 }
      - { name: y, type: int16 }
  Item:
    fields:
      - { name: id, type: uint8, values: Kind }
  Login:
    fields:
      - { name: user_id, type: uint32 }
enums:
  Kind:
    1: Login
    2: Code
    "3-5": Point
