[package]
name = "wirdigen-cli"
description = "Command-line interface for wirdigen"
readme = "../../README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
keywords.workspace = true

[[bin]]
name = "wirdigen"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
tempfile = "3.27.0"
wirdigen.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
trycmd = "1.2.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
