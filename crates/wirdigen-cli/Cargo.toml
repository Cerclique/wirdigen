[package]
name = "wirdigen-cli"
description = "Command-line interface for wirdigen"
readme = "../../README.md"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
license-file = "../../LICENSE"
keywords.workspace = true

[[bin]]
name = "wirdigen"
path = "src/main.rs"
doc = false

# `cargo binstall wirdigen-cli` downloads the archives that release.yml attaches to each Release.
# The URL is spelled out because `repository` ends in a slash, which `{ repo }` would double.
[package.metadata.binstall]
pkg-url = "https://github.com/Cerclique/wirdigen/releases/download/v{ version }/wirdigen-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "https://github.com/Cerclique/wirdigen/releases/download/v{ version }/wirdigen-{ target }.zip"
pkg-fmt = "zip"

[dependencies]
clap.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
wirdigen.workspace = true

# Completions and man pages are generated at build time from the clap definitions (spec §9.1).
[build-dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
clap_complete.workspace = true
clap_mangen.workspace = true
trycmd = "1.2.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
