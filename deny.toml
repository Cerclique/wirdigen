[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "ISC"]
confidence-threshold = 0.9
# The tshark tests enable serde_json's `preserve_order`, which pulls in foldhash. cargo-deny
# unifies features across the graph, so it reaches the CLI's serde_json too, though no binary uses it.
exceptions = [{ allow = ["Zlib"], crate = "foldhash" }]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
