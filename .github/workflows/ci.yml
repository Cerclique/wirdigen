name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked --all-targets
      - run: cargo test --workspace --locked --all-targets
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked --all-targets

  # The lua and tshark-* jobs run their tests in the images of docker/, through
  # the same make targets as local runs (docker/README.md). Each job builds its image with the
  # layers cached across runs, so the target skips its own `docker build` (DOCKER_PREBUILT=1).
  # The containers build Rust into target/docker/, which rust-cache does not cover (it caches
  # the host's target/), so that is cached with actions/cache instead. zizmor reads
  # build-push-action as a publisher and flags those caches; it only loads the image locally.
  #
  # The Lua checks (spec §10.4), in the tshark-stable-24.04 image.
  lua:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A new cache scope each week, so the image picks up new releases from the stable PPA.
      - name: Week of the year
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Build the tshark-stable-24.04 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/tshark-stable-24.04/Dockerfile
          tags: wirdigen-tshark-stable-24.04
          load: true
          cache-from: type=gha,scope=tshark-stable-24.04-${{ steps.week.outputs.week }}
          cache-to: type=gha,scope=tshark-stable-24.04-${{ steps.week.outputs.week }},mode=max
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            target/docker/cargo-home
            target/docker/tshark-stable-24.04
          key: docker-${{ github.job }}-${{ hashFiles('docker/tshark-stable-24.04/Dockerfile', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: docker-${{ github.job }}-
      - run: make docker-test-lua DOCKER_PREBUILT=1

  # The Wireshark 4.4 floor (spec §10.5). The target prints `tshark --version` from the image.
  tshark-4_4:
    name: tshark-4.4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the tshark-4.4 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/tshark-4.4/Dockerfile
          tags: wirdigen-tshark-4.4
          load: true
          cache-from: type=gha,scope=tshark-4.4
          cache-to: type=gha,scope=tshark-4.4,mode=max
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            target/docker/cargo-home
            target/docker/tshark-4.4
          key: docker-${{ github.job }}-${{ hashFiles('docker/tshark-4.4/Dockerfile', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: docker-${{ github.job }}-
      - run: make docker-test-tshark-4.4 DOCKER_PREBUILT=1

  # The latest stable Wireshark, following upstream releases through the PPA (spec §10.5).
  tshark-stable-24_04:
    name: tshark-stable-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A new cache scope each week, so the image picks up new releases from the stable PPA.
      - name: Week of the year
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Build the tshark-stable-24.04 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/tshark-stable-24.04/Dockerfile
          tags: wirdigen-tshark-stable-24.04
          load: true
          cache-from: type=gha,scope=tshark-stable-24.04-${{ steps.week.outputs.week }}
          cache-to: type=gha,scope=tshark-stable-24.04-${{ steps.week.outputs.week }},mode=max
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            target/docker/cargo-home
            target/docker/tshark-stable-24.04
          key: docker-${{ github.job }}-${{ hashFiles('docker/tshark-stable-24.04/Dockerfile', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: docker-${{ github.job }}-
      - run: make docker-test-tshark-stable-24.04 DOCKER_PREBUILT=1

  # The latest stable Wireshark again, from the same PPA on Ubuntu 26.04 (spec §10.5), so a
  # difference in the newer LTS's build shows up.
  tshark-stable-26_04:
    name: tshark-stable-26.04
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # A new cache scope each week, so the image picks up new releases from the stable PPA.
      - name: Week of the year
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Build the tshark-stable-26.04 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/tshark-stable-26.04/Dockerfile
          tags: wirdigen-tshark-stable-26.04
          load: true
          cache-from: type=gha,scope=tshark-stable-26.04-${{ steps.week.outputs.week }}
          cache-to: type=gha,scope=tshark-stable-26.04-${{ steps.week.outputs.week }},mode=max
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning]
        with:
          path: |
            target/docker/cargo-home
            target/docker/tshark-stable-26.04
          key: docker-${{ github.job }}-${{ hashFiles('docker/tshark-stable-26.04/Dockerfile', 'rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: docker-${{ github.job }}-
      - run: make docker-test-tshark-stable-26.04 DOCKER_PREBUILT=1

  # Builds the book without deploying it (book.yml deploys). Its YAML snippets and the
  # Diagnostics index are checked by the `book` unit tests in the `rust` and `test` jobs.
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@0.5.4
      - run: make book

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version
        id: msrv
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "$MSRV" --profile minimal
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo "+$MSRV" check --workspace --locked --all-targets
        env:
          MSRV: ${{ steps.msrv.outputs.version }}

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources

  machete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete
      - run: cargo machete

  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@2611abd15acb0c2e317fb9e45855aabb8b35a414 # v1.52.1

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # SUMMARY.md lists unwritten chapters as empty draft links, which lychee rejects; the
          # `book` job checks its links instead (`create-missing = false` fails on a missing file).
          args: --offline --no-progress --exclude-path 'book/src/SUMMARY\.md' '**/*.md'
          fail: true

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
      - run: ./actionlint -color
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scopes: |
            diagnostics
          requireScope: false

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo publish --workspace --dry-run --locked
