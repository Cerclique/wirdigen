# Deploys the book to GitHub Pages (spec §11): the latest tag at `/`, `main` at `/dev/` with a
# "development version" banner (book/dev-banner.js). Until a tag carries `book/`, `/` serves
# `main` too, so the Diagnostic links rendered by the library resolve. PRs only build the book,
# in ci.yml.

name: Book

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: mdbook@0.5.4
      - name: Build the release book at / and main's at /dev/
        run: |
          set -euo pipefail
          # Pre-releases sort before their release: 1.0.0-rc.1 < 1.0.0.
          latest=$(git -c versionsort.suffix=-alpha -c versionsort.suffix=-beta -c versionsort.suffix=-rc \
            tag --list 'v*' --sort=-v:refname | head -n1)
          release=origin/main
          if [ -n "$latest" ] && git cat-file -e "$latest:book/book.toml" 2>/dev/null; then
            release=$latest
          fi
          echo "release book from $release, dev book from origin/main"

          build() { # <ref> <dest> <site-url>
            local tree
            tree=$(mktemp -d)
            git worktree add --detach "$tree" "$1"
            MDBOOK_OUTPUT__HTML__SITE_URL="$3" mdbook build "$tree/book" --dest-dir "$2"
          }
          build "$release" "$RUNNER_TEMP/site" /wirdigen/
          build origin/main "$RUNNER_TEMP/site/dev" /wirdigen/dev/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
