name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag, the manifest version and the changelog
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].version] | unique | join(",")')"
          if [[ "$manifest" != "$version" ]]; then
            echo "::error::tag $TAG does not match the manifest version(s) '$manifest'"
            exit 1
          fi
          .github/scripts/changelog-section.sh "$version" > /dev/null
          if [[ "$version" =~ -(alpha|beta|rc)(\.|$) ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Swatinem/rust-cache: a published crate must build from a clean tree.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Draft the GitHub Release from the changelog
        run: |
          .github/scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
      # Binaries, completions, man pages and the JSON Schema are attached here
      # once their jobs exist (spec §12.4 step 4).
      - name: Publish the GitHub Release
        run: gh release edit "$TAG" --draft=false
