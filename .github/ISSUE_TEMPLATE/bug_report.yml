name: Bug report
description: Wirdigen rejects a valid Protocol Description, generates a wrong Dissector, or misbehaves.
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security issue, please report privately instead: see
        [SECURITY.md](https://github.com/Cerclique/wirdigen/blob/main/docs/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Protocol Description
      description: >
        The `.wirdigen.yaml` file, cut down to the smallest one that still shows the bug if you
        can. Pasted here, it is formatted as YAML.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: >
        The Diagnostics or error Wirdigen printed, or for a Dissector bug what Wireshark shows
        (the packet bytes, the tree, any Lua error). Attach a capture if you can.
      render: text
  - type: input
    id: wirdigen-version
    attributes:
      label: Wirdigen version
      description: The output of `wirdigen --version`.
      placeholder: wirdigen 1.0.0
    validations:
      required: true
  - type: input
    id: wireshark-version
    attributes:
      label: Wireshark version
      description: >
        The first line of `tshark --version`, or Help → About Wireshark. Write "none" if
        the bug does not involve Wireshark.
      placeholder: TShark (Wireshark) 4.6.9
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11, macOS 15, …
    validations:
      required: true
