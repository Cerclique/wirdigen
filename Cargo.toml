[workspace]
resolver = "3"
members = ["crates/wirdigen", "crates/wirdigen-cli"]

[workspace.package]
version = "1.0.0-alpha.0"
authors = ["Aurélien VERNIZEAU <aurelien.vernizeau@gmail.com>"]
edition = "2024"
rust-version = "1.85"
homepage = "https://github.com/Cerclique/wirdigen/"
repository = "https://github.com/Cerclique/wirdigen/"
license-file = "LICENSE"
keywords = ["wireshark", "dissector", "lua"]

[workspace.dependencies]
wirdigen = { version = "=1.0.0-alpha.0", path = "crates/wirdigen" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
