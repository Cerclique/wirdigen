[workspace]
resolver = "3"
members = ["crates/wirdigen", "crates/wirdigen-cli"]

[workspace.package]
version = "1.0.0-alpha.0"
authors = ["Aurélien VERNIZEAU <aurelien.vernizeau@gmail.com>"]
edition = "2024"
rust-version = "1.85"
homepage = "https://github.com/Cerclique/wirdigen/"
repository = "https://github.com/Cerclique/wirdigen/"
license-file = "LICENSE"
keywords = ["wireshark", "dissector", "lua"]

[workspace.dependencies]
wirdigen = { version = "=1.0.0-alpha.0", path = "crates/wirdigen" }
# The CLI's build script and tests use these too, so one pin each keeps them in step.
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
